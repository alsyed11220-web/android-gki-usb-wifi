name: Build Android 16 GKI Clean

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Official Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git flex bison libssl-dev libelf-dev bc binfmt-support clang lld llvm

    - name: Clone Google Android 16 GKI Kernel
      run: |
        git clone --depth=1 -b common-android16-6.12 https://googlesource.com /home/runner/common

    - name: Inject Custom Wireless Settings
      run: |
        cd /home/runner/common
        make ARCH=arm64 LLVM=1 gki_defconfig
        cat <<EOF >> arch/arm64/configs/gki_defconfig
        CONFIG_CFG80211=y
        CONFIG_MAC80211=y
        CONFIG_NL80211_TESTMODE=y
        CONFIG_CFG80211_CERTIFICATION_ONUS=y
        CONFIG_RTL8188FU=y
        CONFIG_RTL88XXAU=y
        CONFIG_RTL8192CU=y
        CONFIG_MT7601U=y
        CONFIG_RT2X00=y
        CONFIG_RT2800USB=y
        CONFIG_ATH_COMMON=y
        CONFIG_ATH9K_HTC=y
        EOF

    - name: Compile GKI Kernel Image
      run: |
        cd /home/runner/common
        make ARCH=arm64 LLVM=1 gki_defconfig
        make ARCH=arm64 LLVM=1 -j$(nproc) Image.gz

    - name: Upload Compiled Image.gz
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Kernel-Image
        path: /home/runner/common/arch/arm64/boot/Image.gz
